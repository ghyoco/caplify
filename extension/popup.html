<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caplify Control</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #12141a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 10px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #334155;
      color: #94a3b8;
    }
    .status-active {
      background: #065f46;
      color: #34d399;
    }
    .btn-toggle {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #0284c7;
      color: #ffffff;
      transition: background 0.2s;
    }
    .btn-toggle:hover {
      background: #0369a1;
    }
    .btn-stop {
      background: #e11d48;
    }
    .btn-stop:hover {
      background: #be123c;
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: #64748b;
      margin: 14px 0 8px;
      font-weight: 600;
    }
    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
    }
    .mode-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .latency-card {
      margin-top: 14px;
      padding: 10px;
      background: #1e293b;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .latency-val {
      font-weight: 700;
      color: #22c55e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Caplify</div>
    <div id="statusBadge" class="status-badge">Idle</div>
  </div>

  <button id="toggleBtn" class="btn-toggle">Start Captioning</button>

  <div class="section-title">ASR Engine (Dual-Mode)</div>
  <div class="mode-group">
    <label class="mode-option">
      <input type="radio" name="asrMode" value="vosk" checked>
      <span>Fast Mode (Vosk, &lt;30ms)</span>
    </label>
    <label class="mode-option">
      <input type="radio" name="asrMode" value="whisper">
      <span>Accurate Mode (Whisper INT8)</span>
    </label>
  </div>

  <div class="latency-card">
    <span style="font-size: 12px; color: #94a3b8;">Processing Latency:</span>
    <span id="latencyDisplay" class="latency-val">-- ms</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
